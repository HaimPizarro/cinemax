<!-- Hero Terror -->
<header class="py-5 text-center hero-drama shadow-sm">
  <div class="container">
    <h1 class="fw-bold display-5">Películas de Terror 👻</h1>
    <p class="lead">¡Sólo para valientes!</p>
  </div>
</header>

<!-- Listado dinámico -->
<main class="container py-5">
  <div class="row row-cols-1 row-cols-md-3 g-4 fade-up">
    <div class="col" *ngFor="let peli of terrorMovies">
      <div class="card h-100 shadow-sm border-0 position-relative">

        <!-- Badge descuento -->
        <span *ngIf="peli.descuento > 0"
              class="badge bg-danger badge-discount">
          -{{ peli.descuento }}%
        </span>

        <!-- Imagen -->
        <div class="ratio ratio-4x3">
          <img [src]="peli.imagen"
               [alt]="peli.titulo"
               class="card-img-top object-fit-cover rounded-top" />
        </div>

        <!-- Botones editar/eliminar SOLO PARA ADMIN -->
        <div *ngIf="isAdmin"
             class="position-absolute top-0 end-0 m-2 d-flex gap-2">
          <button class="btn btn-sm btn-outline-primary"
                  (click)="editarPelicula(peli)">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger"
                  (click)="eliminarPelicula(peli)">
            <i class="bi bi-trash"></i>
          </button>
        </div>

        <!-- Cuerpo -->
        <div class="card-body d-flex flex-column text-center">
          <h5 class="card-title fw-semibold">
            {{ peli.titulo }} ({{ peli.anio }})
          </h5>
          <p class="card-text flex-grow-1">{{ peli.descripcion }}</p>

          <!-- Precio visible para cliente o admin -->
          <ng-container *ngIf="isClient || isAdmin">
            <div class="s-price mb-3">
              ${{ precioFinal(peli) | number:'1.0-0' }}
            </div>
          </ng-container>

          <!-- Botón carrito solo para cliente -->
          <ng-container *ngIf="isClient ||isAdmin">
            <button class="btn btn-brand w-100 mt-auto"
                    (click)="agregarAlCarrito(peli)">
              Agregar al carrito
            </button>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- FAB “+” SOLO PARA ADMIN -->
<button *ngIf="isAdmin"
        class="btn btn-primary rounded-circle shadow fab"
        (click)="openDialog()"
        aria-label="Agregar película">
  <i class="bi bi-plus fs-4"></i>
</button>

<!-- Modal Agregar/Editar -->
<div *ngIf="addModalOpen" class="modal-backdrop-custom"></div>
<div *ngIf="addModalOpen" class="modal-dialog-centered-custom">
  <div class="modal-content shadow-lg">
    <form (ngSubmit)="guardarPelicula()" [formGroup]="newMovieForm">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">
          {{ isEditMode ? 'Editar película' : 'Nueva película de Terror' }}
        </h5>
        <button type="button"
                class="btn-close btn-close-white"
                (click)="closeDialog()">
        </button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Título</label>
          <input type="text"
                 class="form-control"
                 formControlName="titulo" />
        </div>
        <div class="mb-3">
          <label class="form-label">Año</label>
          <input type="number"
                 class="form-control"
                 formControlName="anio" />
        </div>
        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <textarea rows="3"
                    class="form-control"
                    formControlName="descripcion"></textarea>
        </div>
        <div class="row g-3">
          <div class="col-6">
            <label class="form-label">Precio</label>
            <input type="number"
                   class="form-control"
                   formControlName="precio" />
          </div>
          <div class="col-6">
            <label class="form-label">Descuento (%)</label>
            <input type="number"
                   class="form-control"
                   formControlName="descuento" />
          </div>
        </div>
        <div class="mb-3 mt-3">
          <label class="form-label">URL Imagen</label>
          <input type="url"
                 class="form-control"
                 formControlName="imagen" />
        </div>
      </div>
      <div class="modal-footer">
        <button type="button"
                class="btn btn-secondary"
                (click)="closeDialog()">
          Cancelar
        </button>
        <button type="submit"
                class="btn btn-brand"
                [disabled]="submitting || newMovieForm.invalid">
          {{ isEditMode ? 'Guardar cambios' : 'Crear' }}
          <span *ngIf="submitting"
                class="spinner-border spinner-border-sm ms-2"></span>
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Confirm Delete Modal -->
<div *ngIf="showDeleteConfirm" class="delete-backdrop"></div>
<div *ngIf="showDeleteConfirm" class="delete-confirm-dialog">
  <div class="dialog-body">
    ¿Eliminar <strong>{{ movieToDelete?.titulo }}</strong>?
  </div>
  <div class="dialog-footer">
    <button class="btn btn-danger" (click)="confirmDelete()">Sí</button>
    <button class="btn btn-secondary" (click)="cancelDelete()">No</button>
  </div>
</div>
